[project]
name = "subgate-api"
version = "0.1.0"
description = "Subgate Nano streaming API"
requires-python = ">=3.12"
dependencies = [
  "eth-account>=0.13,<1.0",
  "fastapi[standard]>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = ["aiosqlite>=0.20,<1.0", "pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
