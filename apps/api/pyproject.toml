[project]
name = "subgate-api"
version = "0.1.0"
description = "Subgate Nano streaming API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
